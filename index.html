<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logia BG Lab</title>
<style>
:root{--bg:#0f1220;--panel:#171b2e;--line:#2a3050;--text:#e8ebff;--mute:#8d95c0;--acc:#5b8cff;--ok:#38c98a;--bad:#ff6b6b;--warn:#f5b84b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14 px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0f1220ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0 8px 0 0}
button,select,input,textarea{font:inherit;color:var(--text);background:#1f2540;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.ok{background:var(--ok);border-color:var(--ok);color:#06241a}
button:disabled{opacity:.45;cursor:default}
.wrap{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px;max-width:1500px;margin:auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.panel h2{font-size:13px;margin:0 0 10px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
label{display:block;margin:8px 0 3px;color:var(--mute);font-size:12px}
.panel input,.panel select,.panel textarea{width:100%}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.chk{display:flex;gap:6px;align-items:center;margin-top:8px;color:var(--text)}
.chk input{width:auto}
.hint{color:var(--mute);font-size:12px;margin-top:6px}
.stat{margin-left:auto;color:var(--mute)}
.stat b{color:var(--text)}
.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.q>h3{margin:0 0 8px;font-size:13px;color:var(--mute)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1100px){.pair{grid-template-columns:1fr}}
.slot{border:1px solid var(--line);border-radius:10px;padding:10px;background:#12162a}
.slot.approved{border-color:var(--ok)}
.slot .top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.badge{font-size:11px;padding:2px 7px;border-radius:99px;background:#2a3050;color:var(--mute)}
.badge.q{background:#3a2f66;color:#cbb8ff}.badge.a{background:#1d4a3b;color:#8ff0c6}
.slot input.kw{flex:1}
.body{display:flex;gap:10px}
.phone{width:120px;flex:none;aspect-ratio:9/16;border-radius:12px;overflow:hidden;position:relative;border:1px solid var(--line);background:linear-gradient(#b9dcff,#3ea2ff 40%,#4a56e6 75%,#8f7be6)}
.phone img{position:absolute;left:0;top:0;width:100%;display:block;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.phone .t{position:absolute;left:0;right:0;top:9%;text-align:center;color:#fff;font-weight:700;font-size:11px;text-shadow:0 1px 4px #0006;padding:0 6px}
.phone svg{position:absolute;left:0;bottom:0;width:100%}
.phone.clean .t,.phone.clean svg{display:none}
.vars{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;align-content:start}
.v{position:relative;aspect-ratio:9/10;border-radius:8px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:#222}
.v img{width:100%;height:100%;object-fit:cover;display:block}
.v.sel{border-color:var(--acc)}
.v.rej{opacity:.25}
.v .x{position:absolute;top:2px;right:2px;background:#000a;border:0;border-radius:6px;padding:0 6px;font-size:12px;line-height:18px}
.v .dl{position:absolute;bottom:2px;right:2px;background:#000a;border:0;border-radius:6px;padding:0 6px;font-size:11px;line-height:18px}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.acts button{padding:4px 9px;font-size:12px}
.err{color:var(--bad);font-size:12px;margin-top:6px;word-break:break-word}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--mute);border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:8px;display:none;z-index:9;max-width:90vw}
#lb{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:10}
#lb img{max-width:92vw;max-height:92vh}
</style>
</head>
<body>
<header>
  <h1>Logia BG Lab</h1>
  <button id="genAll" class="pri">Згенерувати всі порожні</button>
  <button id="apprAll">Затвердити обрані</button>
  <button id="dlAll" class="ok">Завантажити затверджені (zip)</button>
  <button id="reset">Скинути</button>
  <div class="stat">слотів <b id="sSlots">0</b> · затв. <b id="sAppr">0</b> · витрачено ≈ $<b id="sSpent">0.00</b></div>
</header>

<div class="wrap">
<aside>
  <div class="panel">
    <h2>OpenAI</h2>
    <label>API ключ (лишається в браузері, іде лише на api.openai.com)</label>
    <input id="key" type="password" placeholder="sk-..." autocomplete="off">
    <label class="chk"><input type="checkbox" id="remember"> запам'ятати в цьому браузері</label>
    <label class="chk"><input type="checkbox" id="mock"> mock-режим (без API, для перевірки інтерфейсу)</label>
    <div class="hint">Ключ не потрапляє в репозиторій і на сервер сайту. Краще окремий ключ з лімітом витрат.</div>
  </div>
  <div class="panel">
    <h2>Параметри</h2>
    <label>Модель</label><input id="model" value="gpt-image-2">
    <div class="row">
      <div><label>Якість</label><select id="quality"><option>low</option><option>medium</option><option>high</option><option>auto</option></select></div>
      <div><label>Формат</label><select id="fmt"><option>png</option><option>jpeg</option><option>webp</option></select></div>
    </div>
    <label>Розмір</label>
    <select id="sizeSel"><option value="1152x1280">top 1152x1280 (верх екрана)</option><option value="1152x2048">full 1152x2048 (9:16)</option><option value="1024x1024">square 1024x1024</option><option value="custom">свій...</option></select>
    <input id="sizeCustom" placeholder="WxH, кратно 16, напр. 1440x1600" style="display:none;margin-top:6px">
    <div class="row">
      <div><label>Варіантів на слот (1-8)</label><input id="n" type="number" min="1" max="8" value="2"></div>
      <div><label>Паралельно</label><input id="conc" type="number" min="1" max="6" value="3"></div>
    </div>
    <div class="hint" id="costHint"></div>
  </div>
  <div class="panel">
    <h2>Стиль</h2>
    <label>Базовий промпт</label>
    <textarea id="base" style="min-height:150px"></textarea>
    <label>Настрій питання</label><input id="moodQ">
    <label>Настрій відповіді</label><input id="moodA">
    <label>Негатив</label><input id="neg">
  </div>
  <div class="panel">
    <h2>Питання → ключові слова</h2>
    <label>Рядки у форматі «питання || відповідь»</label>
    <textarea id="qs" placeholder="Яке місто називають Вічним містом? || Рим"></textarea>
    <div class="row" style="margin-top:8px"><button id="plan" class="pri">Придумати слова (LLM)</button><button id="planMock">Без LLM</button></div>
    <label>Або вставте MD (## Q01 / q: / a:)</label>
    <textarea id="md" placeholder="## Q01&#10;q: ancient library, candlelight&#10;a: papyrus scrolls, golden dawn"></textarea>
    <button id="loadMd" style="margin-top:8px;width:100%">Завантажити MD</button>
  </div>
</aside>
<main id="list"></main>
</div>
<div id="toast"></div>
<div id="lb"><img></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const PRICE={low:.006,medium:.053,high:.211,auto:.053};
const DEF={base:"Wide stylized digital painting, soft atmospheric haze, pastel neon palette of cyan, cobalt blue, violet and magenta pink, glowing lights, a sun or moon disc near one edge. The top fifth is calm smooth sky with no detail. The main landmark sits in the middle third. The lower part dissolves into a flat soft blue-violet haze. Semi-realistic illustration.",moodQ:"Mood: mysterious, darker, unresolved.",moodA:"Mood: revealing, brighter, resolved.",neg:"text, letters, numbers, faces, logos, watermark, frames, UI elements"};
const EXAMPLE=[["ancient library, candlelight, dust motes","papyrus scrolls, marble columns, golden dawn"],["night sky, telescope, observatory dome","nebula, spiral galaxy, deep violet"],["stone bridge, morning fog, river","castle on cliff, banners, sunrise"]];
let slots=[]; let spent=0; const running=new Set();

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function toast(t,ms=3500){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms)}
function size(){const v=$('#sizeSel').value;return v==='custom'?$('#sizeCustom').value.trim():v}
function checkSize(s){const m=/^(\d+)x(\d+)$/.exec(s);if(!m)throw new Error('Розмір має бути WxH');const w=+m[1],h=+m[2];if(w%16||h%16)throw new Error('Сторони кратні 16');if(Math.max(w,h)>3840)throw new Error('Макс. сторона 3840');if(w*h>8294400)throw new Error('Макс. 8,29 Мп');return[w,h]}
function cost(n){let px=1024*1024;try{const[w,h]=checkSize(size());px=w*h}catch(e){}return n*PRICE[$('#quality').value]*px/1048576}
function params(){return{model:$('#model').value.trim(),quality:$('#quality').value,fmt:$('#fmt').value,size:size(),n:Math.max(1,Math.min(8,+$('#n').value||2))}}
function prompt(s){const parts=[$('#base').value.trim(),`Scene: ${s.kw}.`,(s.kind==='q'?$('#moodQ').value:$('#moodA').value).trim()];const ng=$('#neg').value.trim();if(ng)parts.push(`Avoid: ${ng}.`);return parts.filter(Boolean).join(' ')}

function initSlots(pairs){slots=[];pairs.forEach(([q,a],i)=>{const n=String(i+1).padStart(2,'0');slots.push({id:`Q${n}-q`,n:i+1,kind:'q',kw:q||'',vars:[],picked:null,approved:false,err:'',st:'idle'},{id:`Q${n}-a`,n:i+1,kind:'a',kw:a||'',vars:[],picked:null,approved:false,err:'',st:'idle'})});render()}
function parseMd(t){const out=[];let cur=null;for(const raw of t.split('\n')){const l=raw.trim();if(/^##\s*Q?\d+/i.test(l)){cur=['',''];out.push(cur)}else if(cur&&/^q\s*:/i.test(l))cur[0]=l.replace(/^q\s*:/i,'').trim();else if(cur&&/^a\s*:/i.test(l))cur[1]=l.replace(/^a\s*:/i,'').trim()}return out}

function phoneSvg(){return `<svg viewBox="0 0 100 60" preserveAspectRatio="none"><path d="M0 60V28Q50 8 100 28V60Z" fill="#5a3fd1"/><circle cx="50" cy="26" r="10" fill="#f2c9a0"/><path d="M30 24Q50-6 70 24Z" fill="#3b2b9e"/></svg>`}
function render(){
  const L=$('#list');L.innerHTML='';
  const byN={};slots.forEach(s=>(byN[s.n]=byN[s.n]||[]).push(s));
  Object.values(byN).forEach(pair=>{
    const box=document.createElement('div');box.className='q';box.innerHTML=`<h3>Питання ${pair[0].n}</h3><div class="pair"></div>`;
    pair.forEach(s=>box.querySelector('.pair').appendChild(slotEl(s)));L.appendChild(box)});
  stats();
}
function slotEl(s){
  const el=document.createElement('div');el.className='slot'+(s.approved?' approved':'');el.id='s-'+s.id;
  const pk=s.vars.find(v=>v.id===s.picked&&!v.rej);
  el.innerHTML=`<div class="top"><span class="badge ${s.kind}">${s.kind==='q'?'питання':'відповідь'}</span><input class="kw" value="${esc(s.kw)}" placeholder="ключові слова сцени"></div>
  <div class="body"><div class="phone" ${pk?'':'style="opacity:.5"'}>${pk?`<img src="${pk.url}">`:''}<div class="t">Розкажи як це було</div>${phoneSvg()}</div>
  <div class="vars">${s.vars.map(v=>`<div class="v ${v.id===s.picked?'sel':''} ${v.rej?'rej':''}" data-id="${v.id}"><img src="${v.url}"><button class="x" title="відхилити">✕</button><button class="dl" title="зберегти">⤓</button></div>`).join('')}</div></div>
  <div class="acts"><button class="gen pri">${s.vars.length?'Ще варіанти':'Згенерувати'}</button><button class="appr ${s.approved?'ok':''}" ${pk?'':'disabled'}>${s.approved?'Затверджено ✓':'Затвердити'}</button><button class="clean">Макет/чисто</button>${s.st==='gen'?'<span class="spin"></span>':''}</div>
  ${s.err?`<div class="err">${esc(s.err)}</div>`:''}`;
  el.querySelector('.kw').onchange=e=>{s.kw=e.target.value;save()};
  el.querySelector('.gen').onclick=()=>generate(s);
  el.querySelector('.appr').onclick=()=>{s.approved=!s.approved;render()};
  el.querySelector('.clean').onclick=()=>el.querySelector('.phone').classList.toggle('clean');
  el.querySelectorAll('.v').forEach(d=>{const v=s.vars.find(x=>x.id===d.dataset.id);
    d.onclick=()=>{s.picked=v.id;s.approved=false;render()};
    d.ondblclick=()=>{$('#lb img').src=v.url;$('#lb').style.display='flex'};
    d.querySelector('.x').onclick=e=>{e.stopPropagation();v.rej=!v.rej;if(v.rej&&s.picked===v.id)s.picked=(s.vars.find(x=>!x.rej)||{}).id||null;render()};
    d.querySelector('.dl').onclick=e=>{e.stopPropagation();dlOne(s,v)}});
  return el}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function stats(){$('#sSlots').textContent=slots.length;$('#sAppr').textContent=slots.filter(s=>s.approved).length;$('#sSpent').textContent=spent.toFixed(2);$('#costHint').textContent=`≈ $${cost(params().n).toFixed(3)} за слот, $${(cost(params().n)*30).toFixed(2)} за 30 слотів (оцінка)`;save()}
function save(){ls('logia_cfg',JSON.stringify({base:$('#base').value,moodQ:$('#moodQ').value,moodA:$('#moodA').value,neg:$('#neg').value,model:$('#model').value,quality:$('#quality').value,fmt:$('#fmt').value,sizeSel:$('#sizeSel').value,sizeCustom:$('#sizeCustom').value,n:$('#n').value,conc:$('#conc').value,kws:slots.map(s=>[s.kind,s.n,s.kw]),mock:$('#mock').checked}));if($('#remember').checked)ls('logia_key',$('#key').value);else ls('logia_key','')}

function mockImage(seed,w,h){const c=document.createElement('canvas');c.width=w/4;c.height=h/4;const g=c.getContext('2d');let x=seed*9301+49297;const r=()=>(x=(x*9301+49297)%233280)/233280;const hue=Math.floor(r()*360);const gr=g.createLinearGradient(0,0,0,c.height);gr.addColorStop(0,`hsl(${hue},45%,35%)`);gr.addColorStop(1,`hsl(${(hue+40)%360},55%,65%)`);g.fillStyle=gr;g.fillRect(0,0,c.width,c.height);g.fillStyle=`hsl(${(hue+60)%360},80%,88%)`;g.beginPath();g.arc(c.width*(.2+.6*r()),c.height*.35,c.width/12,0,7);g.fill();for(let l=0;l<3;l++){g.fillStyle=`hsl(${hue},35%,${16+l*7}%)`;g.beginPath();g.moveTo(0,c.height);for(let i=0;i<=8;i++)g.lineTo(i*c.width/8,c.height*(.52+l*.1)+(r()-.5)*c.height*.12);g.lineTo(c.width,c.height);g.fill()}return c.toDataURL('image/png')}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function oa(path,body,tries=4){const key=$('#key').value.trim();if(!key)throw new Error('Вставте API ключ або увімкніть mock');
  for(let i=0;i<tries;i++){let r;try{r=await fetch('https://api.openai.com/v1/'+path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify(body)})}catch(e){if(i==tries-1)throw new Error('Мережа: '+e.message);await sleep(1500*2**i);continue}
    if(r.ok)return r.json();const j=await r.json().catch(()=>({}));const m=(j.error&&j.error.message)||r.status;if((r.status===429||r.status>=500)&&i<tries-1){await sleep(1500*2**i);continue}throw new Error(`${r.status}: ${m}`)}}

async function generate(s){
  if(s.st==='gen')return;s.err='';
  let p;try{p=params();checkSize(p.size)}catch(e){s.err=e.message;render();return}
  s.st='gen';render();
  try{
    const mime={png:'image/png',jpeg:'image/jpeg',webp:'image/webp'}[p.fmt];
    let items=[];
    if($('#mock').checked){await sleep(400);items=Array.from({length:p.n},(_,i)=>({url:mockImage(Date.now()%1e5+i*17+s.n,...checkSize(p.size))}))}
    else{const j=await oa('images/generations',{model:p.model,prompt:prompt(s),size:p.size,quality:p.quality,n:p.n,output_format:p.fmt});items=j.data.map(d=>({url:`data:${mime};base64,${d.b64_json}`}));spent+=cost(items.length)}
    items.forEach((it,i)=>{it.id=Date.now().toString(36)+i+Math.random().toString(36).slice(2,5);it.fmt=$('#mock').checked?'png':p.fmt;s.vars.push(it)});
    if(!s.picked)s.picked=items[0].id
  }catch(e){s.err=e.message}
  s.st='idle';render()}

async function genAll(){const todo=slots.filter(s=>!s.vars.length&&s.kw.trim());if(!todo.length){toast('Немає порожніх слотів з ключовими словами');return}
  const c=Math.max(1,Math.min(6,+$('#conc').value||3));const q=[...todo];await Promise.all(Array.from({length:c},async()=>{while(q.length)await generate(q.shift())}))}

async function plan(useLlm){
  const lines=$('#qs').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>l.split('||').map(x=>x.trim()));
  if(!lines.length){toast('Введіть питання');return}
  if(!useLlm||$('#mock').checked){initSlots(lines.map(([q,a])=>[kwFrom(q),kwFrom(a||'')]));toast('Слова взято з тексту, відредагуйте руками');return}
  const btn=$('#plan');btn.disabled=true;btn.textContent='Думаю...';
  try{const rule="For each quiz question+answer write two lists of 3-5 English visual keywords for a background scene. Question scene must NOT reveal the answer, answer scene reveals it; both in the same visual world; scenes differ across the whole set; no people, faces, text, logos or brands; landmark-friendly, objects and light.";
    const j=await oa('chat/completions',{model:'gpt-4.1-mini',response_format:{type:'json_schema',json_schema:{name:'plan',strict:true,schema:{type:'object',additionalProperties:false,required:['items'],properties:{items:{type:'array',items:{type:'object',additionalProperties:false,required:['q','a'],properties:{q:{type:'string'},a:{type:'string'}}}}}}}},messages:[{role:'system',content:rule},{role:'user',content:lines.map(([q,a],i)=>`${i+1}. ${q} => ${a||''}`).join('\n')}]});
    const items=JSON.parse(j.choices[0].message.content).items;initSlots(lines.map((_,i)=>[(items[i]||{}).q||'',(items[i]||{}).a||'']));toast('Слова готові, перегляньте і поправте')}
  catch(e){toast('Planner: '+e.message,6000)}btn.disabled=false;btn.textContent='Придумати слова (LLM)'}
function kwFrom(t){return t.replace(/[?.!]/g,'').split(/\s+/).filter(w=>w.length>3).slice(0,5).join(', ')}

function ext(v){return v.fmt==='jpeg'?'jpg':v.fmt||'png'}
function b64(url){return url.split(',')[1]}
function dlOne(s,v){const a=document.createElement('a');a.href=v.url;a.download=`${s.id}.${ext(v)}`;a.click()}
async function dlAll(){const ap=slots.filter(s=>s.approved);if(!ap.length){toast('Немає затверджених слотів');return}
  if(!window.JSZip){toast('JSZip не завантажився, збережіть вручну (⤓)');return}
  const z=new JSZip();const items={};
  slots.forEach(s=>{const v=s.vars.find(x=>x.id===s.picked);const n=s.n;items[n]=items[n]||{question:n,q_bg:null,a_bg:null};if(s.approved&&v){const f=`${s.id.replace('-','_')}.${ext(v)}`;z.file(f,b64(v.url),{base64:true});items[n][s.kind+'_bg']=f}});
  z.file('manifest.json',JSON.stringify({version:1,size:size(),items:Object.values(items)},null,2));
  z.file('keywords.json',JSON.stringify(slots.map(s=>({id:s.id,kw:s.kw,prompt:prompt(s)})),null,2));
  const blob=await z.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='logia-backgrounds.zip';a.click()}

$('#genAll').onclick=genAll;
$('#apprAll').onclick=()=>{slots.forEach(s=>{if(s.picked&&!s.approved&&s.vars.some(v=>v.id===s.picked&&!v.rej))s.approved=true});render()};
$('#dlAll').onclick=dlAll;
$('#reset').onclick=()=>{if(confirm('Скинути всі слоти і картинки?')){spent=0;initSlots(Array.from({length:15},()=>['','']))}};
$('#plan').onclick=()=>plan(true);$('#planMock').onclick=()=>plan(false);
$('#loadMd').onclick=()=>{const p=parseMd($('#md').value);if(!p.length){toast('MD не розпізнано');return}initSlots(p)};
$('#sizeSel').onchange=()=>{$('#sizeCustom').style.display=$('#sizeSel').value==='custom'?'block':'none';stats()};
$('#lb').onclick=()=>$('#lb').style.display='none';
['quality','n','sizeCustom','model','fmt','base','moodQ','moodA','neg','conc','mock','remember','key'].forEach(i=>$('#'+i).addEventListener('change',stats));

(function init(){
  $('#base').value=DEF.base;$('#moodQ').value=DEF.moodQ;$('#moodA').value=DEF.moodA;$('#neg').value=DEF.neg;
  let kws=null;try{const c=JSON.parse(ls('logia_cfg')||'null');if(c){['base','moodQ','moodA','neg','model','quality','fmt','sizeSel','sizeCustom','n','conc'].forEach(k=>{if(c[k]!==undefined&&$('#'+k))$('#'+k).value=c[k]});$('#mock').checked=!!c.mock;kws=c.kws}}catch(e){}
  const k=ls('logia_key');if(k){$('#key').value=k;$('#remember').checked=true}
  $('#sizeCustom').style.display=$('#sizeSel').value==='custom'?'block':'none';
  const pairs=Array.from({length:15},(_,i)=>EXAMPLE[i]?[EXAMPLE[i][0],EXAMPLE[i][1]]:['','']);
  if(kws){const m={};kws.forEach(([kd,n,kw])=>{(m[n]=m[n]||['',''])[kd==='q'?0:1]=kw});const arr=Object.keys(m).sort((a,b)=>a-b).map(n=>m[n]);if(arr.length)pairs.splice(0,pairs.length,...arr)}
  initSlots(pairs)})();
</script>
</body>
</html>
